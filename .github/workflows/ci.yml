name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sem `with: version` de propósito: a versão do pnpm vem do campo
      # "packageManager" do package.json. Declarar nos dois lugares faz o
      # action abortar com "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint typecheck test build

      # Ciclo de dependência não aparece em typecheck nem em teste. Só aqui.
      - run: pnpm depcruise

      # As fronteiras do AGENTS.md precisam FALHAR quando violadas. Um lint que
      # passa porque a regra foi apagada por engano é pior que nenhum lint.
      - name: fronteiras de camada realmente bloqueiam
        run: |
          set -e
          # R1: core/ do web não conhece React
          echo "import { useState } from 'react'; export const x = useState;" \
            > apps/web/src/core/__ci_r1.ts
          # R8: o signaling não parseia SDP
          echo "export const x = (p: { sdp: string }) => p.sdp;" \
            > apps/signaling/src/__ci_r8.ts
          if pnpm exec eslint apps --no-warn-ignored; then
            echo "::error::o lint aprovou uma violação de fronteira"
            exit 1
          fi
          rm apps/web/src/core/__ci_r1.ts apps/signaling/src/__ci_r8.ts
          pnpm exec eslint apps packages --no-warn-ignored

      - name: o front estático não carrega SDK de SFU
        run: |
          set -e
          if grep -rl "livekit" apps/web/dist/assets 2>/dev/null; then
            echo "::error::R2 violada: SDK de SFU foi parar no bundle"
            exit 1
          fi
          echo "bundle limpo"

  signaling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tela/shared build && pnpm --filter @tela/signaling build

      # O entry point do Worker não tem teste — ele não decide nada, delega
      # tudo para ChannelRoom, que a suíte de conformidade cobre. Mas ele
      # precisa pelo menos existir compilado, senão o deploy quebra.
      - name: o entry point do Worker compilou
        run: test -f apps/signaling/dist/worker-entry.js

      # O servidor precisa subir de verdade e responder. Um bootstrap quebrado
      # passa em typecheck e falha só no deploy.
      - name: sobe e responde
        run: |
          set -e
          PORT=3399 node apps/signaling/dist/server.js &
          PID=$!
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3399/health >/dev/null && break
            sleep 0.25
          done
          curl -sf http://127.0.0.1:3399/health | tee /dev/stderr | grep -q '"ok":true'
          kill $PID

  # ─────────────────────────────────────────────────────────────────────────
  # Publica sozinho, mas SÓ depois que tudo passou.
  #
  # `needs` nos dois jobs é o ponto: sem isso o deploy correria em paralelo com
  # os testes e publicaria código quebrado enquanto o CI ainda estava vermelho.
  # A regra do projeto é que a árvore verde é a condição de publicar, não uma
  # sugestão.
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    needs: [check, signaling]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Um deploy por vez. Dois `push` seguidos poderiam publicar fora de ordem e
    # deixar no ar o commit mais VELHO dos dois.
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # `pnpm release` reconstrói, confere que `dist/` bate com o HEAD e só
      # então chama o wrangler. Rodar `wrangler deploy` direto publicaria o que
      # estivesse em disco, sem perguntar de quando é.
      - name: publicar
        run: pnpm release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Publicar sem conferir é publicar no escuro. O carimbo de versão existe
      # para isto: se o que responde não for o commit que acabou de subir, o
      # deploy falhou de um jeito que o wrangler não reportou.
      - name: confirmar que o que está no ar é este commit
        run: |
          set -e
          sleep 8
          node scripts/check-prod.mjs
