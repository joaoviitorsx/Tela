name: ci

on:
  push:
    # `develop` é onde o trabalho acontece; checar só a `main` deixava a
    # integração passar semanas sem portão (TELA-024).
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sem `with: version` de propósito: a versão do pnpm vem do campo
      # "packageManager" do package.json. Declarar nos dois lugares faz o
      # action abortar com "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint typecheck test build

      # Ciclo de dependência não aparece em typecheck nem em teste. Só aqui.
      - run: pnpm depcruise

      # O script de áudio do Linux mexe no servidor de som de quem transmite:
      # duplicar retorno ou descarregar módulo alheio é defeito que o usuário
      # sente. Roda contra um `pactl` falso (TELA-010).
      - name: script de áudio do Linux é idempotente e reversível
        run: pnpm test:audio-linux

      # As malhas de controle não têm defeito que teste unitário pegue: elas
      # falham por DINÂMICA — oscilação, estado absorvente, uma malha medindo a
      # própria atuação. O simulador roda 1200 cenários de 300s em cinco
      # segundos, e já pegou uma regressão que deixava as duas malhas mudas ao
      # mesmo tempo, com 275 testes verdes ao lado dela (ADR 0019).
      - name: as malhas de controle não regrediram
        run: node e2e/malhas.sim.mjs --portao

      # As fronteiras do AGENTS.md precisam FALHAR quando violadas. Um lint que
      # passa porque a regra foi apagada por engano é pior que nenhum lint.
      - name: fronteiras de camada realmente bloqueiam
        run: |
          set -e
          # R1: core/ do web não conhece React
          echo "import { useState } from 'react'; export const x = useState;" \
            > apps/web/src/core/__ci_r1.ts
          # R8: o signaling não parseia SDP
          echo "export const x = (p: { sdp: string }) => p.sdp;" \
            > apps/signaling/src/__ci_r8.ts
          if pnpm exec eslint apps --no-warn-ignored; then
            echo "::error::o lint aprovou uma violação de fronteira"
            exit 1
          fi
          rm apps/web/src/core/__ci_r1.ts apps/signaling/src/__ci_r8.ts
          pnpm exec eslint apps packages --no-warn-ignored

      - name: o front estático não carrega SDK de SFU
        run: |
          set -e
          if grep -rl "livekit" apps/web/dist/assets 2>/dev/null; then
            echo "::error::R2 violada: SDK de SFU foi parar no bundle"
            exit 1
          fi
          echo "bundle limpo"

  # ─────────────────────────────────────────────────────────────────────────
  # Navegador de verdade (TELA-024). Os testes com fake provam a lógica; só
  # dois Chromium provam que ela fala com o WebRTC que existe: SDP, ICE,
  # encoder, estéreo L/R, convite, pausa, e a malha com o link estreito.
  # `getDisplayMedia` não existe em headless — a captura é um canvas.
  # ─────────────────────────────────────────────────────────────────────────
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @tela/shared build
      - name: sobe front e signaling
        run: |
          pnpm dev > dev.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:3333/health >/dev/null \
              && curl -sf http://localhost:5173/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3333/health
      - name: malha, áudio, convite e pausa em dois Chromium
        run: pnpm e2e
      - name: link estreito — a sessão desce, diz o motivo e volta
        run: node e2e/banda.e2e.mjs
      - name: log do servidor de desenvolvimento
        if: failure()
        run: tail -200 dev.log

  signaling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tela/shared build && pnpm --filter @tela/signaling build

      # O entry point do Worker não tem teste — ele não decide nada, delega
      # tudo para ChannelRoom, que a suíte de conformidade cobre. Mas ele
      # precisa pelo menos existir compilado, senão o deploy quebra.
      - name: o entry point do Worker compilou
        run: test -f apps/signaling/dist/worker-entry.js

      # O servidor precisa subir de verdade e responder. Um bootstrap quebrado
      # passa em typecheck e falha só no deploy.
      - name: sobe e responde
        run: |
          set -e
          PORT=3399 node apps/signaling/dist/server.js &
          PID=$!
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3399/health >/dev/null && break
            sleep 0.25
          done
          curl -sf http://127.0.0.1:3399/health | tee /dev/stderr | grep -q '"ok":true'
          kill $PID

  # ─────────────────────────────────────────────────────────────────────────
  # Publica sozinho, mas SÓ depois que tudo passou.
  #
  # `needs` nos dois jobs é o ponto: sem isso o deploy correria em paralelo com
  # os testes e publicaria código quebrado enquanto o CI ainda estava vermelho.
  # A regra do projeto é que a árvore verde é a condição de publicar, não uma
  # sugestão.
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    needs: [check, signaling, navegador]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Um deploy por vez. Dois `push` seguidos poderiam publicar fora de ordem e
    # deixar no ar o commit mais VELHO dos dois.
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Credencial ausente FALHA, e a inversão custou dois commits em produção.
      #
      # Antes este passo terminava VERDE sem publicar, com o argumento de que
      # um X vermelho permanente ensina a ignorar o vermelho. O argumento é
      # bom e a consequência foi pior: sem os secrets configurados, TODO push
      # passava verde sem publicar, e a produção ficou dois commits atrás sem
      # que nada em lugar nenhum reclamasse. Descobriu-se por acaso.
      #
      # Verde tem que significar "está no ar". Se não dá para publicar, o
      # estado é quebrado e merece vermelho — uma vez só, até alguém
      # configurar os secrets.
      - name: credencial de deploy
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          faltando=""
          if [ -z "$TOKEN" ]; then faltando="$faltando CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$CONTA" ]; then faltando="$faltando CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -n "$faltando" ]; then
            echo "::error::secret ausente:$faltando — a main NÃO está sendo publicada."
            echo "Configure com:"
            echo "  gh secret set CLOUDFLARE_API_TOKEN"
            echo "  gh secret set CLOUDFLARE_ACCOUNT_ID"
            echo "O token sai de Cloudflare → My Profile → API Tokens,"
            echo "template \"Edit Cloudflare Workers\". Ver docs/DEPLOY.md."
            exit 1
          fi

      # `pnpm release` reconstrói, confere que `dist/` bate com o HEAD e só
      # então chama o wrangler. Rodar `wrangler deploy` direto publicaria o que
      # estivesse em disco, sem perguntar de quando é.
      - name: publicar
        run: pnpm release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Publicar sem conferir é publicar no escuro. O carimbo de versão existe
      # para isto: se o que responde não for o commit que acabou de subir, o
      # deploy falhou de um jeito que o wrangler não reportou.
      #
      # Sem condição nenhuma: este passo é a definição de "deu certo".
      - name: confirmar que o que está no ar é este commit
        run: |
          set -e
          sleep 8
          node scripts/check-prod.mjs
