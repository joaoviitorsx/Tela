name: desktop

# Gera os instaladores do Tela Desktop e publica um pré-release no GitHub.
#
# Dispara numa tag `desktop-vX.Y.Z` (o site não é versionado por tag; o
# prefixo diz de que app é). `workflow_dispatch` existe para ensaiar o
# empacotamento sem publicar nada: os instaladores saem como artefato do run.
# O caminho humano — subir versão, criar a tag, testar — está em
# docs/desktop/BETA.md.
#
# Menor privilégio (S-04, docs/seguranca/revisao-2026-10-02.md): o workflow
# inteiro só LÊ. Quem instala dependências e roda o electron-builder
# (`preparar`, `empacotar`) nunca vê um token com escrita — um script de
# instalação comprometido não tem como alterar o repositório nem o release.
# A escrita está em dois jobs que NÃO executam código do projeto:
# `rascunho` (cria o release) e `publicar` (anexa os arquivos e o publica).
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # O postinstall do Electron baixa ~100 MB de binário que ninguém aqui abre.
  # O electron-builder baixa o próprio zip do Electron (cache dele) e só lê a
  # versão de node_modules/electron/package.json.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  # O renderer é compilado com o signaling de produção embutido: o app não tem
  # tela de configuração, e a beta tem que falar com o mesmo servidor do site.
  VITE_SIGNAL_URL: wss://tela.transmissao.workers.dev/signal
  VITE_PUBLIC_ORIGIN: https://tela.transmissao.workers.dev

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Confere a versão e roda o mínimo do app antes de qualquer build. Só lê.
  # ─────────────────────────────────────────────────────────────────────────
  preparar:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.versao.outputs.tag }}
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }

      # A tag É a versão. `desktop-v0.1.0-beta.1` com package.json em 0.1.0
      # publicaria um instalador que se apresenta com outro número — e o
      # electron-builder usa a versão do package.json para achar o release.
      #
      # `REF_TYPE`/`REF_NAME` entram por `env`, não por `${{ }}` dentro do
      # script: o nome de uma tag aceita `$`, `(`, `;` e crases, e interpolado
      # direto viraria comando do shell (S-04).
      - name: a tag é a versão do package.json
        id: versao
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          versao=$(node -p "require('./apps/desktop/package.json').version")
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$versao" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "desktop-v$versao" ]; then
            echo "::error::a tag é $REF_NAME, mas apps/desktop/package.json está em $versao."
            echo "Suba a versão no package.json e crie a tag desktop-v<versão> no mesmo commit."
            exit 1
          fi

      # Push de tag não passa pelo ci.yml (ele filtra por branch). Verde é a
      # condição de publicar, então o mínimo do app roda aqui.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint typecheck test --filter=@tela/desktop...

  # ─────────────────────────────────────────────────────────────────────────
  # Abre o release como RASCUNHO, antes de qualquer build.
  #
  # Rascunho primeiro, por dois motivos: os dois empacotadores rodam em
  # paralelo e os dois tentariam criar o release ao mesmo tempo; e um
  # pré-release pela metade (só Windows, sem hash) não deve aparecer na
  # página. Escrita, mas sem checkout nem código do projeto: só o `gh`.
  # ─────────────────────────────────────────────────────────────────────────
  rascunho:
    needs: preparar
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: rascunho do release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preparar.outputs.tag }}
          VERSAO: ${{ needs.preparar.outputs.versao }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG já existe; os instaladores entram nele"
            exit 0
          fi
          gh release create "$TAG" --draft --prerelease --verify-tag \
            --title "Tela Desktop $VERSAO" \
            --notes "Beta do Tela Desktop. Como instalar, o aviso do SmartScreen e como conferir o SHA-256 e a proveniência (gh attestation verify): docs/desktop/BETA.md."

  # ─────────────────────────────────────────────────────────────────────────
  # Um runner por sistema: o NSIS precisa de Windows (sem wine), e AppImage,
  # deb e rpm saem do Ubuntu. Sem assinatura em nenhum dos dois (§15).
  #
  # Só LÊ o repositório: o electron-builder roda com `--publish never` e os
  # instaladores seguem como artefato do run para o job `publicar`, que é o
  # único com token de escrita.
  # ─────────────────────────────────────────────────────────────────────────
  empacotar:
    needs: preparar
    strategy:
      # Se o Windows falhar, o Linux ainda sobe — e vice-versa. O rascunho só
      # vira release no job `publicar`, que exige os dois.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      # Sem `with: version`: a versão do pnpm vem do "packageManager" do
      # package.json. Nos dois lugares, o action aborta.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # O electron-builder gera o .rpm com o `rpmbuild` do sistema. Os
      # cabeçalhos do GStreamer e do GLib são do tela-captura (D2): o binário
      # é compilado aqui e vai em `resources/nativo` do pacote Linux. Só
      # cabeçalhos — em tempo de execução ele usa os plugins da máquina de quem
      # instala (recomendados no deb/rpm; no AppImage é detecção ao abrir).
      - name: rpmbuild e cabeçalhos do GStreamer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm gcc pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglib2.0-dev

      # `build.sh` compila com as flags de hardening (S-19: canário de pilha,
      # FORTIFY, PIE, RELRO total); o passo seguinte confere que valeram.
      - name: tela-captura (nativo/linux)
        if: runner.os == 'Linux'
        run: |
          sh apps/desktop/nativo/linux/build.sh
          test -x apps/desktop/nativo/linux/build/tela-captura

      - name: tela-captura com PIE, RELRO total e canário
        if: runner.os == 'Linux'
        run: |
          bin=apps/desktop/nativo/linux/build/tela-captura
          readelf -h "$bin" | grep -q 'Type:.*DYN'
          readelf -d "$bin" | grep -q 'BIND_NOW'
          readelf -lW "$bin" | grep -q 'GNU_RELRO'
          nm -D "$bin" | grep -q '__stack_chk_fail'

      # O addon do "só o jogo" no Windows (D3, docs/desktop/D3-som.md): C++ que
      # captura o áudio de UM processo pelo WASAPI. Compila contra os
      # cabeçalhos do Electron (scripts/build-wasapi.mjs) e o electron-builder
      # o leva em `resources/native`. NÃO derruba o instalador se falhar: o
      # app abre e mostra "Só o jogo" desabilitado com o motivo, e o resto da
      # beta continua testável. O aviso abaixo é para ninguém esquecer.
      - name: addon WASAPI (native/wasapi-loopback)
        id: wasapi
        if: runner.os == 'Windows'
        continue-on-error: true
        run: pnpm --filter @tela/desktop native:win

      - name: addon WASAPI não compilou
        if: runner.os == 'Windows' && steps.wasapi.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Addon WASAPI::O addon do som do jogo NÃO compilou; o instalador sai sem ele (Só o jogo aparece desabilitado). Veja o passo anterior."
          echo "### Addon WASAPI: FALHOU. Este instalador não tem \"Só o jogo\"." >> "$GITHUB_STEP_SUMMARY"

      - name: addon WASAPI compilado
        if: runner.os == 'Windows' && steps.wasapi.outcome == 'success'
        shell: bash
        run: |
          test -f apps/desktop/native/wasapi-loopback/build/Release/wasapi_loopback.node
          echo "### Addon WASAPI: compilado e carregou no runner." >> "$GITHUB_STEP_SUMMARY"

      # Na ordem das dependências: o site importa @tela/shared compilado, e o
      # app empacota o site. `turbo build --filter=@tela/desktop...` não
      # serviria — ele roda o `build` do site, que é a versão para a web, não
      # o `build:desktop`.
      - run: pnpm --filter @tela/shared build
      - run: pnpm --filter @tela/web build:desktop
      - run: pnpm --filter @tela/desktop build

      # `--publish never` em tag e fora dela: este job não tem token de escrita.
      - name: empacotar
        run: pnpm --filter @tela/desktop exec electron-builder --publish never

      # O que o electron-builder gravou no binário tem de ser o que o
      # `electron-builder.yml` pede (S-03): sem RunAsNode, NODE_OPTIONS e
      # --inspect, só o asar, sem privilégios de file:. Um fuse que volta ao
      # padrão de fábrica (upgrade do builder, chave renomeada) falha aqui.
      - name: fuses do binário empacotado
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            node apps/desktop/scripts/verificar-fuses.mjs apps/desktop/release/win-unpacked/Tela.exe win32
          else
            node apps/desktop/scripts/verificar-fuses.mjs apps/desktop/release/linux-unpacked/tela linux
          fi

      # O addon compilado tem de ter ido para dentro do pacote (extraResources
      # do `win` no electron-builder.yml); sem isto o app abriria com "Só o
      # jogo" desabilitado mesmo com o addon compilado.
      - name: addon dentro do pacote do Windows
        if: runner.os == 'Windows' && steps.wasapi.outcome == 'success'
        shell: bash
        run: |
          test -f apps/desktop/release/win-unpacked/resources/native/wasapi_loopback.node
          test -f apps/desktop/release/win-unpacked/resources/som/utilitario-win.js
          test -f apps/desktop/release/win-unpacked/resources/som/package.json

      # O instalador do Windows não é assinado: sem o hash e a proveniência,
      # quem baixa não tem como saber que recebeu o arquivo que o CI gerou
      # (§7). O hash segue aqui (útil sem conta no GitHub); a proveniência é
      # assinada no job `publicar` (`gh attestation verify`, ver BETA.md).
      - name: SHA-256 dos instaladores
        shell: bash
        run: |
          cd apps/desktop/release
          ls -la
          # `ls *.exe` sem .exe sai com erro e o `bash -e` derrubava o passo
          # no Linux (e o mesmo com *.AppImage no Windows). Glob vazio some.
          shopt -s nullglob
          arquivos=(*.exe *.AppImage *.deb *.rpm)
          test "${#arquivos[@]}" -gt 0
          sha256sum "${arquivos[@]}" | tee "SHA256SUMS-${RUNNER_OS}.txt"

      # O auto-update (D5, docs/desktop/D5-atualizacao.md) lê `latest.yml`
      # (Windows) ou `latest-linux.yml` (AppImage) do release: o SHA-512 e o
      # tamanho do instalador estão lá, e o app só instala o que bate. O
      # `.blockmap` do .exe permite baixar só o que mudou. Sem eles o release
      # existe, mas nenhum app instalado o enxerga como atualização — foi o que
      # a reestruturação do S-04 (`--publish never` + job `publicar`) quebrou em
      # silêncio, então o passo falha alto. (O AppImage leva o blockmap
      # embutido; não gera arquivo à parte.)
      - name: arquivos do auto-update
        shell: bash
        run: |
          cd apps/desktop/release
          if [ "$RUNNER_OS" = Windows ]; then
            test -f latest.yml
            test -n "$(ls Tela-*-win-x64.exe.blockmap 2>/dev/null)"
          else
            test -f latest-linux.yml
          fi
          ls -la latest*.yml *.blockmap 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tela-desktop-${{ runner.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
            apps/desktop/release/SHA256SUMS-*.txt
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Só com os dois sistemas empacotados o rascunho recebe os arquivos e vira
  # pré-release visível. Se um deles falhou, o rascunho fica para inspeção — e
  # ninguém baixa metade.
  #
  # É o ÚNICO job com escrita E o único que assina proveniência — e não roda
  # nada do projeto: baixa os artefatos, atesta, anexa e publica.
  #   contents: write      anexar ao release e tirá-lo de rascunho
  #   id-token: write      o certificado de curta duração da atestação (Sigstore)
  #   attestations: write  gravar a atestação no repositório
  # ─────────────────────────────────────────────────────────────────────────
  publicar:
    needs: [preparar, rascunho, empacotar]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tela-desktop-*
          path: instaladores
          merge-multiple: true

      - name: o que vai para o release
        run: |
          ls -la instaladores
          test "$(ls instaladores/*.exe 2>/dev/null | wc -l)" -ge 1
          test "$(ls instaladores/*.AppImage 2>/dev/null | wc -l)" -ge 1
          test -f instaladores/latest.yml
          test -f instaladores/latest-linux.yml
          test "$(ls instaladores/*.exe.blockmap 2>/dev/null | wc -l)" -ge 1

      # O que o app instalado confia é o SHA-512 do `latest*.yml`. Confere que
      # ele descreve o instalador que está aqui — se o artefato foi trocado ou
      # o yml é de outro build, o release não sai (e o rascunho fica).
      - name: latest*.yml descreve os instaladores
        run: |
          for yml in instaladores/latest.yml instaladores/latest-linux.yml; do
            arquivo=$(sed -n 's/^path: //p' "$yml")
            esperado=$(sed -n 's/^sha512: //p' "$yml")
            test -n "$arquivo" && test -n "$esperado"
            real=$(openssl dgst -sha512 -binary "instaladores/$arquivo" | base64 -w0)
            if [ "$real" != "$esperado" ]; then
              echo "::error::$yml diz sha512 $esperado para $arquivo, mas o arquivo tem $real"
              exit 1
            fi
            echo "$yml confere com $arquivo"
          done

      # Proveniência (S-04): liga cada instalador — e o `latest*.yml` e o
      # `.blockmap` que o auto-update consulta — ao commit, ao workflow e ao
      # runner que o gerou. O yml é o que um app instalado segue às cegas:
      # atestá-lo é o que permite conferir que não foi trocado no release. Sem certificado de assinatura de código, é o que
      # permite conferir a ORIGEM do arquivo — o SHA-256 sozinho só prova que
      # o arquivo não mudou depois de gerado (quem troca o instalador no
      # release troca o hash junto).
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            instaladores/*.exe
            instaladores/*.AppImage
            instaladores/*.deb
            instaladores/*.rpm
            instaladores/*.blockmap
            instaladores/latest*.yml

      # O release fica RASCUNHO de propósito (ADR 0038): nada chega ao auto-update
      # antes de o dono assinar os instaladores e publicar. O auto-update só
      # enxerga releases publicados, então o rascunho é invisível até o passo
      # manual de assinar + publicar (docs/desktop/CORTAR-BETA-23.md). Isto fecha
      # a janela em que um release ficaria no ar sem os `.sig`.
      - name: anexar ao release (RASCUNHO — publicar só depois de assinar)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preparar.outputs.tag }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" instaladores/*.exe instaladores/*.AppImage instaladores/*.deb instaladores/*.rpm instaladores/*.blockmap instaladores/latest*.yml instaladores/SHA256SUMS-*.txt --clobber
          gh release view "$TAG"
