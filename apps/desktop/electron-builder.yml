# Empacotamento do Tela Desktop.
#
# Por que electron-builder: o plano (docs/desktop/PLANO-desktop.md §7) decidiu
# NSIS no Windows e AppImage + RPM + DEB no Linux. É a única ferramenta que
# gera os quatro de uma configuração só, e é a que o `electron-updater` espera
# quando a atualização automática entrar — ela ainda NÃO entra: nada aqui
# baixa nem instala nada ao vivo.
#
# Como rodar: `pnpm --filter @tela/desktop dist` (ou dist:linux / dist:win),
# depois de `pnpm --filter @tela/web build:desktop` e
# `pnpm --filter @tela/desktop build`. O CI faz isso em
# .github/workflows/desktop.yml; o caminho humano está em docs/desktop/BETA.md.

appId: io.github.joaoviitorsx.tela
productName: Tela

# `Tela-0.1.0-beta.1-win-x64.exe`, `Tela-0.1.0-beta.1-linux-x64.AppImage`.
# A versão no nome é o que deixa dois instaladores conviverem na pasta de
# downloads de quem testa sem ninguém confundir qual é qual.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# PNG de 1024 px rasterizado de apps/web/public/tela-app-icon.svg. O .ico do
# Windows e os tamanhos do Linux saem dele na hora do empacotamento.
icon: build/icon.png

directories:
  output: release

# Só o que o processo principal carrega. `tsc` compila os testes para
# dist/main também, e eles não pertencem ao pacote.
files:
  - dist/main/**
  - dist/preload/**
  - package.json
  - '!dist/main/**/*.test.js'
  - '!**/*.map'
  - '!**/*.d.ts'
  - '!**/*.d.cts'
  - '!**/.tsbuildinfo'

# O renderer é o site, compilado com `pnpm --filter @tela/web build:desktop`.
# main.ts o serve de `process.resourcesPath/web` quando empacotado.
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: ../web/dist-desktop
    to: web

# Uma dependência de runtime só: `electron-updater` (D5), JavaScript puro, que o
# electron-builder leva para dentro do app.asar com as dependências dele — por
# isso o fuse onlyLoadAppFromAsar não o atrapalha. Nenhuma tem código nativo,
# então reconstruir node_modules seria trabalho à toa. O tela-captura (nativo/linux)
# é um executável à parte, em `extraResources` do Linux abaixo, e o addon do
# som do jogo (native/wasapi-loopback) é um `.node` próprio, em `extraResources`
# do Windows — o node-gyp deles roda no CI, não aqui.
npmRebuild: false

# Fuses do Electron (S-03): o binário vem com tudo ligado "por compatibilidade".
# O que o Tela NÃO usa e que serviria a quem já executa código do mesmo usuário:
#  - runAsNode: `ELECTRON_RUN_AS_NODE=1 tela …` vira um interpretador Node com a
#    identidade do app. O som do Windows usa `utilityProcess`, que não depende dele;
#  - enableNodeOptionsEnvironmentVariable / enableNodeCliInspectArguments:
#    `NODE_OPTIONS=--require x.js` e `--inspect` injetam código no main, que tem
#    o preload e as permissões de captura;
#  - grantFileProtocolExtraPrivileges: a interface vem de `app://`, nunca de `file:`
#    (o `net.fetch('file://…')` do `protocol.handle` é do main e não depende disto).
# E o que PRENDE o código ao pacote:
#  - onlyLoadAppFromAsar: só `resources/app.asar` (sem uma pasta `app/` ao lado);
#  - enableEmbeddedAsarIntegrityValidation: o asar é conferido contra o hash
#    gravado no executável (Windows/macOS; no Linux o fuse não tem efeito). NÃO cobre
#    o que está FORA do asar — `resources/som/*.js` e `resources/native/*.node`
#    (por que estão fora: ver `win.extraResources`). Esses são o risco que sobra,
#    para o qual `docs/seguranca/revisao-2026-10-02.md` S-03 propõe hash no main.
#  - enableCookieEncryption: o app não usa cookies; ligado, os que existirem
#    ficam cifrados com a chave do SO (transição de mão única).
# `.github/workflows/desktop.yml` lê os fuses do binário empacotado e falha se algum
# destes voltar ao padrão (`scripts/verificar-fuses.mjs`).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false

# O link `tela://assistir/<canal>` (D8, PLANO-desktop §14). O NSIS grava o
# esquema no registro do Windows; no Linux o electron-builder acrescenta
# `MimeType=x-scheme-handler/tela;` ao .desktop do deb e do rpm e o `%U` ao
# Exec (verificado em app-builder-lib/LinuxTargetHelper) — por isso não há
# `linux.mimeTypes` aqui. No AppImage não existe instalação: o esquema só
# aparece quando o usuário o integra (AppImageLauncher) ou pelo .desktop.
protocols:
  - name: Tela
    schemes:
      - tela

publish:
  provider: github
  owner: joaoviitorsx
  repo: Tela
  releaseType: prerelease
  # A tag do git é `desktop-vX.Y.Z`: o site não é versionado por tag, e o
  # prefixo diz de que app é. Sem isto o padrão seria `vX.Y.Z`, e o release
  # iria parar numa tag que ninguém criou.
  tagNamePrefix: desktop-v

win:
  target:
    - target: nsis
      arch: [x64]
  # Sem certificado, não assina (§15: SmartScreen aceito por enquanto). `true`
  # só grava ícone e metadados no .exe. docs/desktop/BETA.md explica a quem
  # testa o caminho "Mais informações → Executar assim mesmo".
  signAndEditExecutable: true
  # O addon do "só o jogo" (D3, native/wasapi-loopback), compilado por
  # `pnpm native:win` ANTES do electron-builder (o CI faz). Fora do asar, de
  # propósito: o utility process o carrega por caminho (`createRequire`), e um
  # `.node` dentro do asar não carrega. Se não foi compilado, a pasta não
  # existe e o electron-builder só avisa — o app abre e mostra "Só o jogo"
  # desabilitado com o motivo, nunca em silêncio.
  extraResources:
    - from: native/wasapi-loopback/build/Release
      to: native
      filter:
        - wasapi_loopback.node
    # O utility process do som do jogo roda FORA do asar, pelo mesmo motivo do
    # addon: o Node dele lê o disco de verdade, e dentro do asar o `import` e o
    # "type": "module" (do package.json, que o asar esconde) não se resolvem.
    # São só dois arquivos — o ponto de entrada e o protocolo que ele importa.
    - from: dist/main/som
      to: som
      filter:
        - utilitario-win.js
        - protocolo-utilitario.js
    - from: build/som-modulo.json
      to: som/package.json

nsis:
  # Instalador com telas: quem testa escolhe a pasta e vê o que está
  # instalando. Por usuário, sem pedir administrador.
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  # O nome do pacote vem do `name` do package.json, e `@tela/desktop` viraria
  # `Tela` — com maiúscula, que o dpkg não aceita. Fixo em minúsculas.
  executableName: tela
  # O Electron se apresenta ao ambiente com o `desktopName` do package.json;
  # com o nome igual ao do .desktop gerado, o GNOME junta a janela ao ícone.
  syncDesktopName: true
  category: AudioVideo
  synopsis: Transmita seu jogo em 1080p60 para quem tem o link
  # deb e rpm exigem mantenedor com e-mail. O endereço é o noreply público
  # do GitHub do dono do repositório — não é caixa de ninguém.
  maintainer: Tela <joaoviitorsx@users.noreply.github.com>
  vendor: Tela
  # O tela-captura (D2, docs/desktop/D2-captura.md): captura pelo portal e
  # codifica no NVENC, fora do Chromium. Compilado por nativo/linux/build.sh
  # ANTES do electron-builder (o CI faz isso; o caminho humano está em
  # BETA.md). main.ts o procura em `resources/nativo/tela-captura` e, se não
  # estiver lá ou o `--sondar` disser que não há NVENC, fica no WebCodecs.
  # O modo de arquivo é preservado: o binário sai executável.
  extraResources:
    - from: nativo/linux/build/tela-captura
      to: nativo/tela-captura

# As dependências do tela-captura são RECOMENDADAS, não exigidas: quem não
# tem NVIDIA (ou não quer os plugins) instala do mesmo jeito e transmite com
# o codificador do Chromium. `depends` não é definido de propósito — definir
# substituiria a lista padrão do electron-builder (gtk, nss, xss…).
#   plugins-bad: o `nvh264enc` (nvcodec) · pipewire: o `pipewiresrc` · gl: os
#   `glupload`/`glcolorconvert`/`glcolorscale`
deb:
  packageName: tela
  recommends:
    - gstreamer1.0-plugins-bad
    - gstreamer1.0-pipewire
    - gstreamer1.0-gl
    - gstreamer1.0-plugins-base
    # pw-dump, pw-loopback e pw-metadata: o "só o jogo" e o "sistema" (D3).
    - pipewire-bin

# O rpm do electron-builder (fpm) não tem campo `recommends`; a tag vai
# direto para o spec. No Fedora o nvcodec está no bad-free e os plugins GL
# no plugins-base.
rpm:
  packageName: tela
  fpm:
    - '--rpm-tag'
    - 'Recommends: gstreamer1-plugins-bad-free'
    - '--rpm-tag'
    - 'Recommends: pipewire-gstreamer'
    - '--rpm-tag'
    - 'Recommends: gstreamer1-plugins-base'
    # pw-dump, pw-loopback e pw-metadata: o "só o jogo" e o "sistema" (D3).
    - '--rpm-tag'
    - 'Recommends: pipewire-utils'
