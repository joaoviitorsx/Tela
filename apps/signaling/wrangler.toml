# O nome vira a URL que o usuário manda para os amigos:
#   tela.<conta>.workers.dev/joao
# Por isso é o nome do PRODUTO, não do componente. Este Worker serve o front
# inteiro além da sinalização — chamá-lo de "signaling" seria descrever a
# menor parte do que ele faz.
name = "tela"
main = "dist/worker-entry.js"
compatibility_date = "2026-08-01"
# Necessário para `new Request(...)` preservar headers customizados no fetch
# interno para o Durable Object.
compatibility_flags = ["nodejs_compat"]

# O front estático sai do mesmo Worker. `single-page-application` é o SPA
# fallback: sem ele, o link que a pessoa mandou para os amigos — /joao — dá
# 404, porque não existe arquivo com esse nome.
# Guarda, não build.
#
# `main` e `[assets]` apontam para diretórios que um clone limpo NÃO tem —
# quem os gera é `pnpm cf:build`. Sem esta linha, `wrangler deploy` sem build
# falha com um erro sobre arquivo de entrada ausente que não menciona build
# nem diz qual comando resolve. Foi assim que o Workers Builds ficou com o
# comando de deploy configurado e o de build vazio.
#
# É guarda e não build de propósito: construir aqui duplicaria o trabalho que
# `cf:build` já fez, em toda release e em toda execução da CI.
[build]
command = "node ../../scripts/check-artifacts.mjs"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# O Worker precisa ver a requisição ANTES dos assets, senão `/signal/*` nunca
# chega ao Durable Object, `/health` cai no SPA e `/discord/interactions`
# (docs/DISCORD.md) devolve o index.html para o Discord.
#
# `/*` cobre os três — o wrangler recusa listá-los junto, por redundância — e
# também o link do canal, `/<slug>`: o robô de prévia do Discord/WhatsApp
# recebe ali o estado do canal (src/previa.ts). `*` casa em qualquer
# profundidade e exceção (`!`) vence, então ficam de fora todo arquivo (slug
# não tem ponto), os assets com hash e as rotas do front que não são canal.
# Requisição de asset que NÃO passa pelo Worker não conta na cota — é por isso
# que a lista não é simplesmente `true`.
run_worker_first = [
  "/*",
  "!/",
  "!/*.*",
  "!/assets/*",
  "!/transmitir",
  "!/recuperar",
]

[[durable_objects.bindings]]
name = "CHANNELS"
class_name = "ChannelDurableObject"

# Contador de abuso por IP (S-02): um objeto por IP, sem WebSocket, que o
# objeto do canal (um por slug) não tem como enxergar. O alarme apaga as linhas
# quando as janelas vencem.
[[durable_objects.bindings]]
name = "IP_LIMITER"
class_name = "IpLimiterDurableObject"

# SQLite-backed é OBRIGATÓRIO no plano gratuito — Durable Objects com backend
# key-value continuam sendo recurso pago.
#
# O objeto ESCREVE em storage, ao contrário do que este comentário afirmava:
# duas chaves por canal, ambas pequenas e de vida curta — `posse`, que segura o
# slug pela carência depois que o transmissor sai, e `claims`, a janela do teto
# de reivindicações. As duas precisam sobreviver à hibernação, que é justamente
# quando a memória do objeto some.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChannelDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["IpLimiterDurableObject"]

[vars]
# Precisa acompanhar `P2P_LIMITS.maxViewers` em `packages/shared/src/encoding.ts`
# (50, paridade com o Go Live do Discord — ADR 0029). Esta variável SOBREPÕE o
# padrão do código e só pode BAIXAR o teto do produto, nunca passar dele: ficou
# em "3" depois que o limite subiu para 5, e sozinha teria mantido a produção
# em 3 espectadores enquanto o front prometia 5. O teto por canal é o menor
# entre este e a `capacidade` que o transmissor declara — quem codifica uma
# vez por espectador (Firefox, Safari) continua em 5 por conta própria.
MAX_PEERS = "50"
STUN_URLS = "stun:stun.l.google.com:19302,stun:stun.cloudflare.com:3478"
# Origens extras que podem abrir a sinalização (TELA-019). A do próprio Worker
# já passa; a lista é para quem NÃO é servido por ele. `app://tela` é o Tela
# Desktop (PLANO-desktop §3.5): a interface vem do protocolo próprio do app, e
# sem esta linha o upgrade dele leva 403.
ALLOWED_ORIGINS = "app://tela"
# Validade da credencial TURN, em segundos: 12 h. A alocação TURN morre quando
# a credencial dela vence (FAQ da Cloudflare), e a renovação do `IceLifecycle`
# só vale para conexões novas ou para o próximo ICE restart — com 600 s, todo
# espectador em relay cairia a cada 10 min. A Cloudflare manda dimensionar
# pela sessão mais longa (máximo 48 h).
TURN_TTL_SECONDS = "43200"

# TURN — necessário para a cauda de conexões que não fecham direto.
#
# Sem relay, um par atrás de NAT restritivo dos DOIS lados nunca conecta: o
# WebRTC troca SDP, monta tudo, e nenhum pacote atravessa. O espectador fica
# olhando para uma tela preta. É a causa mais comum de "conectou e não
# aparece nada" entre máquinas em redes diferentes.
#
# Cloudflare Realtime TURN: 1.000 GB grátis por mês, credencial efêmera por
# peer. Crie a chave em Dash → Realtime → TURN e configure como SECRET (este
# arquivo é versionado):
#
#   wrangler secret put TURN_KEY_ID
#   wrangler secret put TURN_KEY_API_TOKEN
#
# Alternativa com coturn próprio:
#   wrangler secret put TURN_SECRET
# [vars]
# ICE_PROVIDER = "auto" # Cloudflare primeiro; coturn configurado vira fallback
# TURN_URLS = "turn:turn.seudominio.com:3478?transport=udp,turn:turn.seudominio.com:3478?transport=tcp,turns:turn.seudominio.com:443?transport=tcp"
# TURN_URL singular continua aceito apenas durante a migração; não combine os dois.
# TURN_FETCH_TIMEOUT_MS = "2500"

# App do Discord (docs/DISCORD.md): o `/tela canal:<slug>` no "+" → "Usar apps".
# A chave pública é SECRET (`wrangler secret put DISCORD_PUBLIC_KEY`); sem ela,
# `/discord/interactions` responde 404. O Application ID é público e opcional:
# com ele, interação de outro app é recusada.
DISCORD_APPLICATION_ID = "1545598563994701824"

[observability]
enabled = true
