<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Transmita sua gameplay em 1080p com menos de 200ms de atraso. Sem cadastro." />

    <!--
      Prévia do link, que é onde este produto é apresentado de verdade: ele
      nasce para ser colado num Discord. Sem Open Graph a prévia saía só com
      texto, porque `name="description"` sozinho não carrega imagem.

      `og:image` é raiz-relativo de propósito. Discord, WhatsApp e Telegram
      resolvem contra a URL da página, então a prévia continua certa se o
      domínio mudar — e ele vai mudar. URL absoluta aqui seria uma string para
      alguém esquecer de atualizar.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tela" />
    <meta property="og:title" content="Seu amigo te chamou pra assistir" />
    <meta
      property="og:description"
      content="Abre no navegador, sem cadastro nem instalar nada. Gameplay em 1080p com menos de 200ms de atraso."
    />
    <!--
      O nome do arquivo muda junto com a arte: Discord e WhatsApp guardam a
      prévia pela URL da imagem, e trocar o conteúdo de `/og.png` deixaria a
      TV verde antiga presa no cache deles por semanas.
    -->
    <meta property="og:image" content="/og-convite.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="TV retrô piscando ao lado do texto: ao vivo agora, seu amigo te chamou pra assistir"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Seu amigo te chamou pra assistir" />
    <!-- A faixa lateral da prévia no Discord vem daqui: o âmbar da arte. -->
    <meta name="theme-color" content="#E99D38" />
    <!-- Sem diretório e sem busca: link só existe para quem recebeu (§15). -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Tela</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Jersey+10&family=Martian+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      O modelo da abertura, baixando em paralelo com o bundle.

      A sondagem tem 150 ms para decidir se a abertura roda e mais 700 ms de
      prazo para o modelo chegar (`core/intro/probe.ts`). Sem este `preload` o
      download só começaria depois de o JavaScript executar, e num 4G o prazo
      estouraria sempre — a abertura simplesmente nunca apareceria em celular.

      208 KB. Na segunda visita o `localStorage` já barra a abertura antes de
      qualquer pixel, mas o navegador ainda baixa isto: é o preço de o modelo
      precisar estar pronto ANTES de a decisão poder ser tomada com tempo de
      mostrar alguma coisa.
    -->
    <script>
      /*
        O preload era estático, e por isso acontecia em TODA rota.

        A abertura só roda na tela inicial. Mas o SPA serve o mesmo `index.html`
        para tudo, então o espectador que abre `tela.gg/joao` — a pessoa que
        recebeu o link, muitas vezes no celular, em rede móvel — baixava 208 KB
        de um modelo 3D que a página dele nunca usa. O próprio navegador
        reclamava: "preloaded but not used within a few seconds".

        Um script inline no `<head>` roda durante o parse, antes do módulo, então
        o download continua paralelo ao bundle — que é o motivo de o preload ser
        estático em primeiro lugar. Só que agora ele pergunta antes.
      */
      if (location.pathname === '/' || location.pathname === '') {
        var l = document.createElement('link');
        l.rel = 'preload';
        l.href = '/tela-crt.glb';
        l.as = 'fetch';
        l.type = 'model/gltf-binary';
        l.crossOrigin = 'anonymous';
        document.head.appendChild(l);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
