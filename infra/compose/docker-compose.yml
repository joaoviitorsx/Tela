# Produção — modo SFU (LiveKit num servidor com IP público).
#
# Para self-host doméstico SEM VPS, use docker-compose.p2p.yml: lá não há
# LiveKit nem Redis, e o servidor é o PC do próprio usuário.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # host network: o Caddy precisa enxergar o LiveKit, que também está em host.
    network_mode: host
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../apps/web/dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  livekit:
    image: livekit/livekit-server:v1.8
    restart: unless-stopped
    # OBRIGATÓRIO. Sem host network o Docker demora minutos no start
    # publicando faixa de porta, e o ICE falha porque os candidatos anunciados
    # apontam para o IP interno do container. Ver §12.7.
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ../livekit/livekit.yaml:/etc/livekit.yaml:ro
    depends_on: [redis]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file: ../.env
    depends_on: [redis]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: >
      redis-server
      --save 900 1
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    # NUNCA 0.0.0.0: Redis exposto na internet é comprometimento em minutos.
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis_data:/data]

volumes:
  caddy_data:
  caddy_config:
  redis_data:
