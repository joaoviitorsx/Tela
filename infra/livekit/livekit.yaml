port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  # Porta UDP única multiplexada. Muito mais simples que faixa de portas — uma
  # regra de firewall, um mapeamento, um lugar para investigar quando falha.
  udp_port: 7882
  # Descobre o IP público via STUN. Sem isto, atrás de NAT o signaling conecta
  # e o vídeo nunca aparece — o sintoma mais confuso do self-host (§12.7).
  use_external_ip: true
  enable_loopback_candidate: false
  congestion_control:
    enabled: true
    # Não congele o vídeo em queda de banda: baixe a qualidade e siga.
    allow_pause: false

redis:
  address: 127.0.0.1:6379

keys:
  # Gere com: openssl rand -base64 36
  APIchangeme: SEGREDO_TROCAR_ANTES_DE_SUBIR

turn:
  enabled: true
  domain: turn.tela.gg
  udp_port: 3478
  tls_port: 5349
  # O LiveKit obtém o certificado sozinho via Let's Encrypt. Exige a porta 80
  # aberta e turn.<dominio> apontando para este IP.

room:
  # Só a API cria sala. Com auto_create true, qualquer token válido cria sala
  # arbitrária e o produto vira relay aberto.
  auto_create: false
  empty_timeout: 120
  departure_timeout: 20
  max_participants: 13

webhook:
  api_key: APIchangeme
  urls:
    - http://127.0.0.1:3333/api/livekit/webhook

logging:
  level: info
  json: false

prometheus_port: 6789
