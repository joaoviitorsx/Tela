packages:
  - 'apps/*'
  - 'packages/*'

# Estas duas viviam em `.npmrc`, e o `.npmrc` sumiu.
#
# O pnpm 10 lê configuração daqui, e o npm NÃO conhece nenhuma das duas — então
# todo `npx` no repositório imprimia dois `npm warn Unknown project config`,
# inclusive no log do Workers Builds, onde ruído parece defeito.
autoInstallPeers: true
strictPeerDependencies: false

# `esbuild` precisa rodar o script de instalação para baixar o binário nativo.
# O pnpm 10 exige a lista aqui, e não em `package.json` — lá ele avisa que
# ignorou e segue sem executar nada, o que aparecia em TODO comando.
onlyBuiltDependencies:
  - esbuild
  # O `wrangler` embute o `workerd`, e o postinstall dele baixa o binário do
  # runtime. Sem aprovação o pnpm PULA o script e avisa — e um wrangler sem
  # workerd falha só quando alguém tenta rodar o Worker localmente, com uma
  # mensagem que não aponta para cá.
  - workerd
  # O postinstall do `electron` baixa o binário do Chromium/Electron. Sem ele, o
  # `apps/desktop` instala e falha só ao abrir, com "Electron failed to install".
  - electron
